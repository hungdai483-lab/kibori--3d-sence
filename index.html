<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 100;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#93c5fd");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });

      AFRAME.registerComponent("sucked-into-blackhole", {
        schema: {
          speed: { type: "number", default: 0.55 },
          minY: { type: "number", default: -5.0 },
          maxY: { type: "number", default: 7.2 },
          baseRadius: { type: "number", default: 4.0 },
          baseAngle: { type: "number", default: 0 },
          baseScale: { type: "number", default: 0.5 },
          spiralTwist: { type: "number", default: 60.0 }
        },
        init: function () {
          this.pos = this.el.object3D.position;
          this.scale = this.el.object3D.scale;
          this.y = this.pos.y;
        },
        tick: function (time, delta) {
          var dt = (delta || 16) / 1000;
          this.y += this.data.speed * dt;
          if (this.y > this.data.maxY) {
            this.y = this.data.minY;
          }

          var t = (this.y - this.data.minY) / (this.data.maxY - this.data.minY);
          t = Math.max(0, Math.min(1, t));

          // Inward funnel convergence toward the black hole singularity
          var rFactor = Math.max(0, 1.0 - Math.pow(t, 1.7));
          var currentR = this.data.baseRadius * rFactor;

          // Spiral vortex angle
          var currentAngle = this.data.baseAngle + (this.data.spiralTwist * Math.pow(t, 2.0));
          var rad = currentAngle * (Math.PI / 180);

          this.pos.x = currentR * Math.sin(rad);
          this.pos.z = -currentR * Math.cos(rad);
          this.pos.y = this.y;

          // Scale shrinks into 0 as it enters the event horizon
          var sFactor = Math.max(0.001, 1.0 - Math.pow(t, 2.2));
          var currentScale = this.data.baseScale * sFactor;
          this.scale.set(currentScale, currentScale, currentScale);

          // Face inward toward the singularity with a gentle floating tilt
          this.el.object3D.rotation.y = -rad;
          this.el.object3D.rotation.x = Math.sin(time * 0.002 + this.data.baseAngle) * 0.12;
          this.el.object3D.rotation.z = Math.cos(time * 0.002 + this.data.baseAngle) * 0.08;
        }
      });
    </script>

      html,

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        if (window.location.protocol === "file:") {
          var banner = document.createElement("div");
          banner.id = "file-warning-banner";
          banner.style.cssText =
            "position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 99999; " +
            "background: rgba(15, 23, 42, 0.95); border: 1px solid #f59e0b; color: #f8fafc; " +
            "padding: 14px 20px; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; " +
            "font-size: 14px; line-height: 1.6; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 90%; text-align: center;";
          banner.innerHTML =
            "⚠️ <strong>Local Browser Security Restriction (CORS):</strong><br/>" +
            "Browsers block loading 3D GLB models when opened directly via <code>file://</code>.<br/>" +
            "Please run a local server in this directory: <code>python3 -m http.server</code><br/>" +
            "Then open: <a href='http://localhost:8000' style='color:#38bdf8; text-decoration: underline;'>http://localhost:8000</a>";
          document.body.appendChild(banner);
        }
      });
    </script>
